<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners for Android & Web -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer decorative Islamic arch/circle -->
  <circle cx="256" cy="256" r="210" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="256" r="195" stroke="#10b981" stroke-width="2" stroke-dasharray="8 8" opacity="0.8"/>
  
  <!-- 8-pointed Islamic Star base -->
  <g transform="rotate(45 256 256)" opacity="0.25">
    <rect x="136" y="136" width="240" height="240" rx="30" stroke="url(#goldGrad)" stroke-width="4"/>
  </g>
  <rect x="136" y="136" width="240" height="240" rx="30" stroke="url(#goldGrad)" stroke-width="4" opacity="0.35"/>

  <!-- Quran Book Icon in center -->
  <g filter="url(#glow)">
    <!-- Quran book stand (Rehal) & Open Pages -->
    <path d="M140 310 C180 280 230 290 256 315 C282 290 332 280 372 310 L372 190 C332 160 282 170 256 195 C230 170 180 160 140 190 Z" fill="#042f2e" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Central Spine divider -->
    <line x1="256" y1="195" x2="256" y2="315" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Left page lines -->
    <path d="M165 215 C195 200 225 205 240 215" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M165 240 C195 225 225 230 240 240" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M165 265 C195 250 225 255 240 265" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <!-- Right page lines -->
    <path d="M272 215 C287 205 317 200 347 215" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M272 240 C287 230 317 225 347 240" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M272 265 C287 255 317 250 347 265" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <!-- Rehal (stand) legs -->
    <path d="M170 320 L130 370 M342 320 L382 370 M210 325 L302 370 M302 325 L210 370" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Magnifying Glass (Search) Motif -->
    <circle cx="340" cy="180" r="38" fill="#064e3b" stroke="#fbbf24" stroke-width="8"/>
    <line x1="368" y1="208" x2="400" y2="240" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
    <circle cx="335" cy="175" r="14" fill="#fbbf24" opacity="0.5"/>
  </g>
</svg>
